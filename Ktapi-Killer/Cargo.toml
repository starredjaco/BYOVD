[workspace]

[package]
name = "ktapi-killer"
version = "0.1.0"
edition = "2021"

[dependencies]
windows = { version = "0.61", features = [
    "Win32",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_System",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Kernel",
    "Win32_System_Diagnostics",
    "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
